name: Lint

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 = mínimo declarado no setup.php (GLPI 10.0); 8.1 a 8.3 = versões usadas pelo GLPI 10 e 11
        php: ['7.4', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (2.40.0)
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: php -l em todos os arquivos PHP
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || status=1
          done < <(find assetterms -name '*.php' -print0)
          exit $status
